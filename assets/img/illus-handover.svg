<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t3 d3">
  <title id="t3">培训与交付示意图</title>
  <desc id="d3">屏幕前摆放交付文档：部署文档、操作手册、验收单、培训记录；两人在桌前操作。插画示意，非实拍。</desc>
  <defs>
    <style>
      .bg{fill:#F6F9FF}
      .card{fill:#fff;stroke:#C9D8F2;stroke-width:1.6}
      .screen{fill:#fff;stroke:#1246C8;stroke-width:1.6}
      .lbl{font:500 14px "Microsoft YaHei",sans-serif;fill:#1B2A4A}
      .sub{font:400 12px "Microsoft YaHei",sans-serif;fill:#5A6B8C}
      .accent{font:600 13px "Microsoft YaHei",sans-serif;fill:#1246C8}
      .doc{fill:#EEF3FF;stroke:#1246C8;stroke-width:1.3}
    </style>
  </defs>
  <rect class="bg" width="640" height="400" rx="16"/>
  <text class="accent" x="40" y="48">交付时您会拿到的东西</text>

  <!-- 屏幕 -->
  <rect class="screen" x="40" y="70" width="270" height="170" rx="8"/>
  <rect x="58" y="88" width="150" height="12" rx="6" fill="#DCE7FF"/>
  <rect x="58" y="112" width="220" height="8" rx="4" fill="#EEF3FF"/>
  <rect x="58" y="130" width="190" height="8" rx="4" fill="#EEF3FF"/>
  <rect x="58" y="148" width="210" height="8" rx="4" fill="#EEF3FF"/>
  <rect x="58" y="176" width="96" height="34" rx="6" fill="#1246C8"/>
  <text x="106" y="198" text-anchor="middle" font="500 13px Microsoft YaHei" fill="#fff">验收演示</text>

  <!-- 人 -->
  <circle cx="150" cy="296" r="16" fill="#C9D8F2"/>
  <path d="M122 362 q28 -40 56 0 z" fill="#C9D8F2"/>
  <circle cx="236" cy="304" r="14" fill="#DCE7FF"/>
  <path d="M212 362 q24 -34 48 0 z" fill="#DCE7FF"/>
  <rect x="60" y="360" width="250" height="10" rx="5" fill="#DCE7FF"/>

  <!-- 文档叠 -->
  <g transform="translate(360,92)">
    <rect class="doc" x="0" y="26" width="200" height="140" rx="8" transform="rotate(-4 100 96)"/>
    <rect class="doc" x="8" y="18" width="200" height="140" rx="8" transform="rotate(-2 108 88)"/>
    <rect class="card" x="16" y="10" width="200" height="140" rx="8"/>
    <text class="lbl" x="116" y="42" text-anchor="middle">交付文档包</text>
    <text class="sub" x="116" y="66" text-anchor="middle">部署文档 · 操作手册</text>
    <text class="sub" x="116" y="86" text-anchor="middle">维护手册 · 验收单</text>
    <text class="sub" x="116" y="106" text-anchor="middle">培训记录</text>
  </g>

  <text class="sub" x="40" y="382">示意图 · 真实培训现场与交付照片待替换</text>
</svg>

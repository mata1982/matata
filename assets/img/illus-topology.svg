<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t1 d1">
  <title id="t1">本地部署拓扑示意图</title>
  <desc id="d1">从互联网经防火墙进入内网，交换机连接 AI 工作站与办公终端，本地知识库与备份盘留在内网；虚线为可选的云端备份。</desc>
  <defs>
    <style>
      .bg{fill:#F6F9FF}
      .card{fill:#fff;stroke:#C9D8F2;stroke-width:1.5}
      .box{fill:#EEF3FF;stroke:#1246C8;stroke-width:1.6}
      .net{fill:#fff;stroke:#1246C8;stroke-width:1.6;stroke-dasharray:6 5}
      .line{stroke:#8FA9D8;stroke-width:2;fill:none}
      .dash{stroke:#8FA9D8;stroke-width:2;fill:none;stroke-dasharray:6 6}
      .lbl{font:500 14px "Microsoft YaHei",sans-serif;fill:#1B2A4A}
      .sub{font:400 12px "Microsoft YaHei",sans-serif;fill:#5A6B8C}
      .accent{font:600 13px "Microsoft YaHei",sans-serif;fill:#1246C8}
    </style>
  </defs>
  <rect class="bg" width="720" height="420" rx="16"/>

  <!-- 外网 -->
  <rect class="net" x="24" y="176" width="120" height="64" rx="10"/>
  <text class="lbl" x="84" y="204" text-anchor="middle">互联网</text>
  <text class="sub" x="84" y="224" text-anchor="middle">可选</text>

  <path class="dash" d="M144 208 H196"/>

  <!-- 防火墙 -->
  <rect class="box" x="196" y="168" width="132" height="80" rx="10"/>
  <text class="lbl" x="262" y="196" text-anchor="middle">防火墙</text>
  <text class="sub" x="262" y="218" text-anchor="middle">默认拒绝 · 日志留存</text>

  <path class="line" d="M328 208 H372"/>

  <!-- 交换机 -->
  <rect class="box" x="372" y="168" width="132" height="80" rx="10"/>
  <text class="lbl" x="438" y="196" text-anchor="middle">交换机</text>
  <text class="sub" x="438" y="218" text-anchor="middle">AI 网段 / 办公网段隔离</text>

  <path class="line" d="M504 190 H548 V120 H588"/>
  <path class="line" d="M504 226 H548 V304 H588"/>

  <!-- AI 工作站 -->
  <rect class="card" x="588" y="76" width="108" height="88" rx="10"/>
  <rect x="600" y="92" width="84" height="38" rx="4" fill="#DCE7FF" stroke="#1246C8" stroke-width="1.2"/>
  <circle cx="642" cy="146" r="5" fill="#1246C8"/>
  <text class="lbl" x="642" y="172" text-anchor="middle">AI 工作站</text>
  <text class="sub" x="642" y="188" text-anchor="middle">模型 + 知识库</text>

  <!-- 办公终端 -->
  <rect class="card" x="588" y="268" width="108" height="76" rx="10"/>
  <rect x="600" y="282" width="84" height="30" rx="4" fill="#EEF3FF" stroke="#8FA9D8" stroke-width="1.2"/>
  <text class="lbl" x="642" y="336" text-anchor="middle">办公终端</text>

  <!-- 内网框 -->
  <rect class="dash" x="368" y="40" width="336" height="344" rx="14" fill="none"/>
  <text class="accent" x="384" y="66">内网 · 数据不出门</text>

  <!-- 备份 -->
  <rect class="card" x="196" y="300" width="132" height="70" rx="10"/>
  <text class="lbl" x="262" y="330" text-anchor="middle">NAS · 离线备份</text>
  <text class="sub" x="262" y="350" text-anchor="middle">每天增量 / 每周全量</text>
  <path class="line" d="M372 330 H328"/>

  <!-- 云端（可选） -->
  <rect class="net" x="196" y="60" width="132" height="70" rx="10"/>
  <text class="lbl" x="262" y="90" text-anchor="middle">云端（可选）</text>
  <text class="sub" x="262" y="110" text-anchor="middle">备份 / 弹性峰值</text>
  <path class="dash" d="M328 95 H372 V150"/>
</svg>

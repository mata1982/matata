<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="玛塔塔 MATATA">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#0B2F8C"/>
    </linearGradient>
  </defs>

  <!-- 底座：自有机器 -->
  <rect width="64" height="64" rx="15" fill="url(#mg)"/>

  <!-- 等距堆叠：模型、资料、权限，层层搭起来。
       小尺寸只用两层 —— 16px 下三层会糊成一团 -->
  <path d="M32 13 L52 23.5 L32 34 L12 23.5 Z" fill="#FFFFFF"/>
  <path d="M12 34 L32 44.5 L52 34" fill="none" stroke="#FFFFFF" stroke-width="5.6"
        stroke-linejoin="round" stroke-linecap="round" opacity="0.72"/>
</svg>
